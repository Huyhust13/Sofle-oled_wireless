# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: sofle_left nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_NICE_OLED_WIDGET_WPM=n -DCONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
  - board: nice_nano_v2
    shield: sofle_right nice_oled
    cmake-args: -DCONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n -DCONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y
  - board: nice_nano_v2
    shield: settings_reset
