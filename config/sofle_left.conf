# Cờ chỉ cho nửa trái (central)

# ZMK Studio: không cần mở khóa (ZMK_STUDIO tự bật locking)
CONFIG_ZMK_STUDIO_LOCKING=n

# Khắc phục lỗi báo cáo pin trên Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Widget OLED: pin nửa trái, Bluetooth profile, tên layer (lấy từ `label` trong keymap)
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_LAYER=y

# Caps Lock: hiện hoạt hình chó Luna khi bật Caps Lock (HID_INDICATORS mặc định y,
# tự bật ZMK_HID_INDICATORS). ONLY_CAPSLOCK để Num/Scroll Lock không kích hoạt.
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA_ONLY_CAPSLOCK=y
