# Cờ chỉ cho nửa trái (central)

# ZMK Studio: không cần mở khóa (ZMK_STUDIO tự bật locking)
CONFIG_ZMK_STUDIO_LOCKING=n

# Khắc phục lỗi báo cáo pin trên Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Pin: nửa trái lấy mức pin nửa phải qua BLE (widget pin cần sự kiện này)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Widget OLED: chỉ hiện pin (trái + phải) và Bluetooth profile
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_LAYER=n
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_AND_CENTRAL=y
