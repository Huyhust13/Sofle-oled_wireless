# Cờ dùng chung cho cả hai nửa.
# Cờ chỉ-central: sofle_left.conf. Cờ chỉ-peripheral: sofle_right.conf.

# Chuột (mouse keys)
CONFIG_ZMK_POINTING=y

# Khử nhiễu phím
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Màn OLED (shield nice_oled tự chọn status screen custom và work queue riêng)
CONFIG_ZMK_DISPLAY=y

# Quản lý năng lượng: idle sau 4 phút, ngủ sau 20 phút
CONFIG_ZMK_IDLE_TIMEOUT=240000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=30
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# BLE (nghi phạm lag Bluetooth, xem CLAUDE.md mục tiêu 6)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_BUF_ACL_RX_SIZE=512
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
